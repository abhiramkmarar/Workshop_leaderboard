<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>register — ctf</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="shell" style="max-width:460px;">
  <div class="topbar">
    <div class="brand"><span class="dot"></span> root@ctf:~$</div>
    <div class="nav-links"><a href="/">Home</a></div>
  </div>

  <div class="card">
    <div class="card-titlebar">
      <span class="tl-dot red"></span><span class="tl-dot yellow"></span><span class="tl-dot green"></span>
      <span class="path">~/register.sh</span>
    </div>
    <div class="card-body">
      <span class="eyebrow">New player</span>
      <h1>Create an account</h1>

      <form id="register-form">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required />

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="new-password" required />

        <button type="submit">Register</button>
        <div class="msg" id="msg"></div>
      </form>

      <p class="hint">3–20 characters, letters/numbers/underscore/dash only. Password must be at least 6 characters.</p>
      <p class="hint">Already registered? <a href="/login.html">Log in</a>.</p>
    </div>
  </div>
</div>

<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Registration failed.');

    msg.textContent = data.message + ' Redirecting to login…';
    msg.className = 'msg show ok';
    setTimeout(() => (window.location.href = '/login.html'), 1200);
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'msg show err';
  }
});
</script>
</body>
</html>
